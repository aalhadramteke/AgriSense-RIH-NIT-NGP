<!DOCTYPE html>
<html>
<head>
    <title>Select Crop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* ✅ Farm background */
            background-image:
                linear-gradient(rgba(0,0,0,0.40), rgba(0,0,0,0.40)),
                url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?w=1600');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            width: 560px;
            padding: 40px 35px;
            border-radius: 24px;

            /* ✅ Glass morphism effect */
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25);

            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 28px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 20px 10px 14px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card:hover {
            transform: scale(1.07);
            background: rgba(255,255,255,0.28);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .selected {
            border: 2px solid #00ff88;
            background: rgba(0,255,136,0.2);
            box-shadow: 0 0 20px rgba(0,255,136,0.5);
            transform: scale(1.07);
        }

        .crop-icon {
            font-size: 44px;
            margin-bottom: 8px;
            line-height: 1;
        }

        .card p {
            margin: 0;
            font-weight: 600;
            font-size: 14px;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ✅ Continue button */
        .btn-wrap { margin-top: 5px; }

        button {
            padding: 13px 45px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(45deg, #00c853, #00e676);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,200,83,0.4);
            opacity: 0.45;
            pointer-events: none;
            width: 100%;
        }

        button.active {
            opacity: 1;
            pointer-events: all;
        }

        button.active:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,200,83,0.5);
        }

        .note {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.8;
            min-height: 18px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .error-msg {
            color: #ffcccc;
            background: rgba(255,0,0,0.2);
            padding: 9px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            backdrop-filter: blur(5px);
        }

        /* ✅ Season badge */
        .season-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.25);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🌾</div>
    <h2>Select Your Crop</h2>
    <p class="subtitle">Choose the crop you want to scan for disease detection</p>
    <div class="season-badge">🌞 Kharif Season 2026 | Maharashtra</div>

    <form action="/upload_page" method="post"
          onsubmit="return validateForm()">

        <div class="grid">

            <div class="card" onclick="selectCrop(this, 'mango')">
                <div class="crop-icon">🥭</div>
                <p>Mango</p>
            </div>

            <div class="card" onclick="selectCrop(this, 'cotton')">
                <div class="crop-icon">🌿</div>
                <p>Cotton</p>
            </div>

            <div class="card" onclick="selectCrop(this, 'grapes')">
                <div class="crop-icon">🍇</div>
                <p>Grapes</p>
            </div>

            <div class="card" onclick="selectCrop(this, 'tomato')">
                <div class="crop-icon">🍅</div>
                <p>Tomato</p>
            </div>

            <div class="card" onclick="selectCrop(this, 'sugarcane')">
                <div class="crop-icon">🎋</div>
                <p>Sugarcane</p>
            </div>

            <div class="card" onclick="selectCrop(this, 'pumpkin')">
                <div class="crop-icon">🎃</div>
                <p>Pumpkin</p>
            </div>

        </div>

        <input type="hidden" name="crop" id="cropInput">

        <div class="error-msg" id="errorMsg">
            ⚠️ Please select a crop before continuing!
        </div>

        <div class="btn-wrap">
            <button type="submit" id="submitBtn">➡ Continue</button>
        </div>

        <div class="note" id="noteText">
            👆 Select a crop to continue
        </div>

    </form>

</div>

<script>
function selectCrop(element, crop) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');
    document.getElementById('cropInput').value = crop;
    document.getElementById('submitBtn').classList.add('active');
    document.getElementById('noteText').innerText =
        '✅ ' + crop.charAt(0).toUpperCase() + crop.slice(1) + ' selected!';
    document.getElementById('errorMsg').style.display = 'none';
}

function validateForm() {
    if (!document.getElementById('cropInput').value) {
        document.getElementById('errorMsg').style.display = 'block';
        return false;
    }
    return true;
}
</script>

</body>
</html>
